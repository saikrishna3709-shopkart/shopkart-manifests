apiVersion: v1
kind: ConfigMap
metadata:
  name: shopkart-dashboard
  namespace: monitoring
  labels:
    # The Grafana sidecar watches for this label and imports the dashboard.
    grafana_dashboard: "1"
data:
  shopkart.json: |
    {
      "title": "ShopKart — Service Overview",
      "uid": "shopkart-overview",
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(http_server_requests_seconds_count{namespace=\"shopkart-dev\"}, service)",
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "panels": [
        {
          "title": "Request rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum by (service) (rate(http_server_requests_seconds_count{namespace=\"shopkart-dev\",service=~\"$service\"}[5m]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "title": "Error rate (5xx %)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1 } },
          "targets": [
            {
              "expr": "sum by (service) (rate(http_server_requests_seconds_count{namespace=\"shopkart-dev\",service=~\"$service\",status=~\"5..\"}[5m])) / sum by (service) (rate(http_server_requests_seconds_count{namespace=\"shopkart-dev\",service=~\"$service\"}[5m]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "title": "Latency p50 / p95 / p99",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"shopkart-dev\",service=~\"$service\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"shopkart-dev\",service=~\"$service\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"shopkart-dev\",service=~\"$service\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "title": "Checkout outcomes",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum by (outcome) (rate(shopkart_orders_total[5m]))",
              "legendFormat": "{{outcome}}"
            }
          ]
        },
        {
          "title": "Checkout success rate",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 0.9 },
                  { "color": "green", "value": 0.97 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(shopkart_orders_total{outcome=\"CONFIRMED\"}[15m])) / clamp_min(sum(rate(shopkart_orders_total[15m])), 0.001)"
            }
          ]
        },
        {
          "title": "Saga compensations (stock released)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 16 },
          "targets": [{ "expr": "sum(increase(shopkart_compensations_total[1h]))" }]
        },
        {
          "title": "Oversell attempts blocked",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 16 },
          "targets": [{ "expr": "sum(increase(shopkart_oversell_blocked_total[1h]))" }]
        },
        {
          "title": "Pod replicas vs HPA ceiling",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 16 },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"shopkart-dev\"}",
              "legendFormat": "{{horizontalpodautoscaler}} current"
            },
            {
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"shopkart-dev\"}",
              "legendFormat": "{{horizontalpodautoscaler}} max"
            }
          ]
        }
      ]
    }
