# Values for the kube-prometheus-stack Helm chart.
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml

fullnameOverride: kube-prometheus-stack

prometheus:
  prometheusSpec:
    retention: 6h
    retentionSize: 512MB
    # Pick up ServiceMonitors from every namespace, not just this one.
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

alertmanager:
  config:
    route:
      receiver: demo
      group_by: ["alertname", "service"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
      routes: []
    receivers:
      - name: demo

grafana:
  defaultDashboardsTimezone: Asia/Kolkata
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 256Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL

# Metrics the HPA depends on. Without metrics-server, HPA targets read <unknown>.
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
