apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shopkart
  namespace: argocd
spec:
  description: ShopKart platform services
  sourceRepos:
    - https://github.com/saikrishna3709-shopkart/shopkart-manifests.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: shopkart-dev
    - server: https://kubernetes.default.svc
      namespace: shopkart-staging
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopkart-dev-platform
  namespace: argocd
spec:
  project: shopkart
  source:
    repoURL: https://github.com/saikrishna3709-shopkart/shopkart-manifests.git
    targetRevision: main
    path: deploy/envs/dev
    directory:
      recurse: false
      include: "{namespace.yaml,ingress.yaml,notification-retry-cronjob.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: shopkart-dev
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: shopkart-dev
  namespace: argocd
spec:
  # One Application per values file — adding a service means adding a file,
  # not hand-writing another Application manifest.
  generators:
    - git:
        repoURL: https://github.com/saikrishna3709-shopkart/shopkart-manifests.git
        revision: main
        files:
          - path: deploy/envs/dev/values/*.yaml
  template:
    metadata:
      name: "{{ .path.filenameNormalized | trimSuffix `-yaml` }}-dev"
    spec:
      project: shopkart
      source:
        repoURL: https://github.com/saikrishna3709-shopkart/shopkart-manifests.git
        targetRevision: main
        path: deploy/charts/shopkart-service
        helm:
          valueFiles:
            - "../../envs/dev/values/{{ .path.filename }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: shopkart-dev
      syncPolicy:
        automated:
          # Reverts anything changed by hand in the cluster.
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=false
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
