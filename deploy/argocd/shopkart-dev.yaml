apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shopkart
  namespace: argocd
spec:
  description: ShopKart platform services
  sourceRepos:
    - __MANIFESTS_REPO_URL__
  destinations:
    - server: https://kubernetes.default.svc
      namespace: shopkart-dev
    - server: https://kubernetes.default.svc
      namespace: shopkart-staging
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: external-secrets.io
      kind: ClusterSecretStore
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopkart-dev-platform
  namespace: argocd
spec:
  project: shopkart
  source:
    repoURL: __MANIFESTS_REPO_URL__
    targetRevision: main
    path: deploy/envs/dev
    directory:
      recurse: false
      include: "{namespace.yaml,cluster-secret-store.yaml,ingress.yaml,notification-retry-cronjob.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: shopkart-dev
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: shopkart-dev
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # One Application per values file — adding a service means adding a file,
  # not hand-writing another Application manifest.
  generators:
    - git:
        repoURL: __MANIFESTS_REPO_URL__
        revision: main
        files:
          - path: deploy/envs/dev/values/*.yaml
  template:
    metadata:
      name: '{{ .path.filename | trimSuffix ".yaml" }}-dev'
    spec:
      project: shopkart
      source:
        repoURL: __MANIFESTS_REPO_URL__
        targetRevision: main
        path: deploy/charts/shopkart-service
        helm:
          # Substituted with the real ECR host when this file is applied, so the
          # AWS account ID never lands in this public repository.
          parameters:
            - name: image.registry
              value: __ECR_REGISTRY__
          valueFiles:
            - "../../envs/dev/values/{{ .path.filename }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: shopkart-dev
      syncPolicy:
        automated:
          # Reverts anything changed by hand in the cluster.
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=false
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
