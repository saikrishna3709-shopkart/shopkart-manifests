apiVersion: v1
kind: Service
metadata:
  name: {{ include "shopkart-service.fullname" . }}
  labels:
    {{- include "shopkart-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "shopkart-service.selectorLabels" . | nindent 4 }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shopkart-service.serviceAccountName" . }}
  labels:
    {{- include "shopkart-service.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.roleArn }}
  annotations:
    # IRSA — the pod assumes this role instead of using the node's permissions.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
  {{- end }}
{{- end }}
