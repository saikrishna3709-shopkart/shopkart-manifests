{{- if .Values.externalSecret.enabled }}
# Pulls the RDS credentials Terraform wrote to AWS Secrets Manager and renders
# them as a Kubernetes Secret. Nothing sensitive is ever committed to git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "shopkart-service.fullname" . }}-db
  labels:
    {{- include "shopkart-service.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "shopkart-service.fullname" . }}-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SPRING_DATASOURCE_URL: >-
          jdbc:postgresql://{{ `{{ .host }}` }}:{{ `{{ .port }}` }}/{{ `{{ .dbname }}` }}
        SPRING_DATASOURCE_USERNAME: {{ `{{ .username }}` | quote }}
        SPRING_DATASOURCE_PASSWORD: {{ `{{ .password }}` | quote }}
  dataFrom:
    - extract:
        key: {{ required "externalSecret.remoteSecretName is required" .Values.externalSecret.remoteSecretName }}
{{- end }}
