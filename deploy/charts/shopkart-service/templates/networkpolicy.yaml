{{- if .Values.networkPolicy.enabled }}
# Namespace-wide default-deny lives in envs/<env>/namespace.yaml; this policy
# re-opens only the paths this service actually needs.
#
# NOTE: NetworkPolicies are silently inert unless the CNI enforces them.
# On EKS that means AWS VPC CNI >= 1.14 with network policy enabled, or Calico.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shopkart-service.fullname" . }}
  labels:
    {{- include "shopkart-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shopkart-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedFrom }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
        {{- end }}
        {{- range .Values.networkPolicy.allowedFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        # Prometheus needs to reach /metrics.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # DNS must be allowed explicitly, or every hostname lookup fails and the
    # symptom looks like a random connection error.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.allowedTo }}
    - to:
        {{- range .Values.networkPolicy.allowedTo }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    {{- end }}
    {{- if .Values.networkPolicy.allowDatabaseEgress }}
    # RDS sits outside the cluster, so this is a CIDR rule rather than a selector.
    - to:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
{{- end }}
