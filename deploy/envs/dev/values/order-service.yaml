nameOverride: order-service

image:
  repository: 000000000000.dkr.ecr.us-east-1.amazonaws.com/shopkart/order-service
  tag: "PLACEHOLDER"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 800m
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # Entry point for checkout — reached from the ingress controller.
  allowedFrom:
    - ingress-nginx
  allowedTo:
    - catalog-service
    - inventory-service
    - payment-service
    - notification-service
  allowDatabaseEgress: true

externalSecret:
  enabled: true
  remoteSecretName: shopkart-dev/rds/master

env:
  LOG_LEVEL: INFO
  CATALOG_SERVICE_URL: http://catalog-service
  INVENTORY_SERVICE_URL: http://inventory-service
  PAYMENT_SERVICE_URL: http://payment-service
  NOTIFICATION_SERVICE_URL: http://notification-service
  DOWNSTREAM_TIMEOUT_SECONDS: "3"
  NOTIFICATION_TIMEOUT_SECONDS: "2"
