nameOverride: catalog-service

image:
  # Registry host is injected by ArgoCD; the tag is bumped by CI to a git SHA.
  repository: shopkart/catalog-service
  tag: "e739f1744f54"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  # Catalog is read-heavy and gets the most traffic.
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 150m
    memory: 192Mi
  limits:
    cpu: 600m
    memory: 384Mi

networkPolicy:
  enabled: true
  allowedFrom:
    - order-service
    - storefront-service
  allowDatabaseEgress: true

externalSecret:
  enabled: true
  remoteSecretName: shopkart-dev/rds/master

env:
  LOG_LEVEL: INFO
