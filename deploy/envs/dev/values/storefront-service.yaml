nameOverride: storefront-service

image:
  repository: 000000000000.dkr.ecr.us-east-1.amazonaws.com/shopkart/storefront-service
  tag: "PLACEHOLDER"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 400m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowedFromNamespaces:
    - ingress-nginx
  allowedTo:
    - catalog-service
    - order-service
  allowDatabaseEgress: false

externalSecret:
  enabled: false

env:
  LOG_LEVEL: INFO
  CATALOG_SERVICE_URL: http://catalog-service
  ORDER_SERVICE_URL: http://order-service
  DOWNSTREAM_TIMEOUT_SECONDS: "3"
