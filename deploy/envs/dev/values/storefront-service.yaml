nameOverride: storefront-service

image:
  repository: shopkart/storefront-service
  tag: "PLACEHOLDER"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 400m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowedFromCidrs:
    - 10.20.0.0/16
  allowedTo:
    - catalog-service
    - order-service
    - inventory-service
    - payment-service
    - notification-service
  allowDatabaseEgress: false

externalSecret:
  enabled: false

env:
  LOG_LEVEL: INFO
  CATALOG_SERVICE_URL: http://catalog-service
  ORDER_SERVICE_URL: http://order-service
  INVENTORY_SERVICE_URL: http://inventory-service
  PAYMENT_SERVICE_URL: http://payment-service
  NOTIFICATION_SERVICE_URL: http://notification-service
  DOWNSTREAM_TIMEOUT_SECONDS: "3"
