nameOverride: payment-service

image:
  repository: shopkart/payment-service
  tag: "e739f1744f54"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 160Mi
  limits:
    cpu: 400m
    memory: 320Mi

networkPolicy:
  enabled: true
  allowedFrom:
    - order-service
    - storefront-service
  allowDatabaseEgress: true

externalSecret:
  enabled: true
  remoteSecretName: shopkart-dev/rds/master

env:
  LOG_LEVEL: INFO
