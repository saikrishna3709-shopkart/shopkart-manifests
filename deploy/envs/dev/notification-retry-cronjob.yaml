apiVersion: batch/v1
kind: CronJob
metadata:
  name: notification-retry
  namespace: shopkart-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: shopkart
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Skip a run entirely rather than piling up if the cluster was busy.
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retry
              image: curlimages/curl:8.11.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              args:
                - --fail
                - --silent
                - --show-error
                - --max-time
                - "60"
                - -X
                - POST
                - http://notification-service/notifications/retry
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
